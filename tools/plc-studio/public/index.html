<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PLC Studio</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='26' height='22' rx='4' fill='%232563eb'/%3E%3Cpath d='M9 12h6M9 17h10M9 22h4' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand"><span class="logo"></span>PLC Studio</div>
        <div class="project-title" id="project-title"></div>
        <div class="topbar-actions">
          <span class="save-state" id="save-state"></span>
          <button class="btn" id="btn-open">Ouvrir…</button>
          <button class="btn" id="btn-new">Nouveau</button>
          <button class="btn primary" id="btn-save" title="Ctrl+S">Enregistrer</button>
        </div>
      </header>
      <nav class="steps" id="steps"></nav>
      <main class="content" id="content"></main>
    </div>
    <div class="modal-backdrop" id="modal" hidden></div>
    <div class="toasts" id="toasts"></div>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
