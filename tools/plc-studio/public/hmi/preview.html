<!DOCTYPE html>
<html lang="fr">
  <!-- Copie de data/index.html pour l'aperçu dans PLC Studio : seul plc-shim.js est ajouté. -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aperçu</title>
    <link rel="stylesheet" href="./styles.min.css" />
    <script src="./plc-shim.js"></script>
    <script async type="module" src="./index.js"></script>
    <style>
      /* Notifications techniques (connexion, rechargement) masquées dans l'aperçu. */
      hw-notification, .sl-toast-stack { display: none !important; }
    </style>
  </head>
  <body class="sl-theme-dark">
    <hw-notification></hw-notification>
    <div class="container-fluid" id="root">
      <div class="top-container">
        <div class="tooltip-container">
          <debug-drawer></debug-drawer>
          <sl-badge variant="primary"><strong id="version-display">Aperçu PLC Studio</strong></sl-badge><plc-status-icon></plc-status-icon>
        </div>
        <div class="tooltip-container right">
          <notification-center></notification-center>
          <interface-editor></interface-editor>
        </div>
      </div>
      <hw-navbar></hw-navbar>
      <div class="col h-100">
        <hw-dynamic socket="" url="config.json"></hw-dynamic>
      </div>
    </div>
  </body>
</html>
